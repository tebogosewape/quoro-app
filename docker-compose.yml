services:
    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        command: npm run start:dev -- --host 0.0.0.0
        env_file:
            - ./apps/api/.env.development
        ports:
            - '2200:2200'
        environment:
            - CHOKIDAR_USEPOLLING=true
            - CHOKIDAR_INTERVAL=300
        volumes:
            - ./apps/api:/app/apps/api
            - api_data:/app/apps/api/data
            - api_node_modules:/app/apps/api/node_modules
        depends_on:
            # - mailhog
            # - experian-mock
            - redis
        networks:
            - northern-rains-dev-network
        tty: true

    worker:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        command: npm run start:worker:dev -- --host 0.0.0.0
        env_file:
            - ./apps/api/.env.development
        environment:
            - CHOKIDAR_USEPOLLING=true
            - CHOKIDAR_INTERVAL=300
        volumes:
            - ./apps/api:/app/apps/api
            - /app/apps/api/node_modules
            - api_data:/app/apps/api/data
        depends_on:
            - redis
            # - mailhog
        networks:
            - northern-rains-dev-network
        tty: true

    web:
        build:
            context: ./apps/web
            dockerfile: Dockerfile
        command: npm run dev -- --host 0.0.0.0 --strictPort
        env_file:
            - ./apps/web/.env.development
        ports:
            - '2100:2100'
        environment:
            - CHOKIDAR_USEPOLLING=true
            - CHOKIDAR_INTERVAL=300
            - WATCHPACK_POLLING=true
            - WATCHPACK_POLLING_INTERVAL=300
        volumes:
            - ./apps/web:/app
            - /app/node_modules
        depends_on:
            - api
        networks:
            - northern-rains-dev-network
        tty: true

    redis:
        image: redis:6-alpine
        container_name: redis-dev
        restart: unless-stopped
        ports:
            - '6379:6379'
        networks:
            - northern-rains-dev-network

